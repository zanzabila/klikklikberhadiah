<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WOW Klik Klik BERHADIAH !!!</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            background-color: antiquewhite;
        }

        .image-container {
            width: 100%;
            height: 100%;
        }
    
        div img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            animation-fill-mode: forwards;
            transition: 0.3s;
        }

        .opaque {
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="image-container">
        <img id="image1" class="image opaque" src="assets/ayobuka.png" />
        <img id="image2" class="image" src="assets/gift.png" />
        <img id="image3" class="image" src="assets/ditutup.png" />
    </div>
    
    <script src="index.js"></script>
</body>

</html>
